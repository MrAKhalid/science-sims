<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spring Energy Challenge</title>
<style>
  :root {
    --bg: #f4f3fb; --panel: #ffffff; --ink: #1d1d2b; --muted: #61617a; --line: #dcdbea;
    --accent: #4b47c9; --scene: #eef4fb; --ok: #18794e; --warn: #a3470b; --bad: #b42318;
    --c-e: #2a6fdb; --c-k: #d61fd0; --c-g: #e07b00; --c-th: #b5361f;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .wrap { max-width: 1360px; margin: 0 auto; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin-bottom: 8px; }
  h1 { font-size: 17px; margin: 0; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  .badge { background: #fff1ec; border: 1px solid #f3c7b8; color: #111; border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 700; }
  header .sp { flex: 1; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; align-items: start; }
  .stuck { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 8px; }
  .stucklbl { font-weight: 600; color: var(--muted); }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  .main { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
  .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; }
  .stage { padding: 6px; }
  canvas#scene { width: 100%; display: block; border-radius: 8px; background: var(--scene); }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 6px; }
  .btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 5px 12px; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:hover { filter: brightness(0.96); }
  .btn:disabled { opacity: .45; cursor: default; }
  select, input[type=text] { font: inherit; padding: 5px 8px; border-radius: 8px; border: 1px solid #c9c8db; background: #fff; color: var(--ink); }
  .gchip { margin-left: auto; font-size: 14px; color: var(--muted); }
  .gchip b { color: var(--ink); }
  .simmsg { font-size: 13px; color: var(--muted); }
  #probText { font-size: 16px; line-height: 1.5; }
  #question { font-size: 16px; font-weight: 700; margin-top: 6px; }
  .answer { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
  .answer label { font-weight: 600; }
  #ans { width: 170px; font-variant-numeric: tabular-nums; }
  .fb { margin-top: 8px; font-size: 14.5px; min-height: 1.2em; }
  .fb.ok { color: var(--ok); font-weight: 600; }
  .fb.warn { color: var(--warn); font-weight: 600; }
  .fb.bad { color: var(--bad); font-weight: 600; }
  aside { display: flex; flex-direction: column; gap: 8px; }
  .bigeq { font-size: 30px; font-weight: 800; text-align: center; letter-spacing: .01em; margin: 2px 0 6px; font-family: Cambria, "Times New Roman", serif; }
  .forms { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; font-size: 14px; font-family: Cambria, "Times New Roman", serif; }
  .forms span { white-space: nowrap; }
  ol.steps { margin: 0; padding-left: 20px; font-size: 13.5px; }
  ol.steps li { margin: 2px 0; }
  #helpBox { font-size: 14.5px; }
  #helpCard.hidden { display: none; }
  details.steps summary { cursor: pointer; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
  details.steps[open] summary { margin-bottom: 6px; }
  .hint { background: #f6f5ff; border-left: 3px solid var(--accent); padding: 6px 10px; border-radius: 6px; margin-bottom: 6px; }
  .sol { font-family: Cambria, "Times New Roman", serif; font-size: 16px; }
  .sol .ln { margin: 5px 0; overflow-x: auto; white-space: nowrap; padding: 1px 0; }
  .sol .note { font-family: system-ui, sans-serif; font-size: 13px; color: var(--muted); white-space: normal; }
  .sol h4 { font-family: system-ui, sans-serif; font-size: 13px; margin: 10px 0 2px; color: var(--accent); }
  .frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 2px; }
  .frac > span { padding: 0 4px; }
  .frac > span:first-child { border-bottom: 1.5px solid currentColor; }
  .sqrt { display: inline-flex; align-items: stretch; vertical-align: middle; }
  .sqrt > .rad { border-top: 1.5px solid currentColor; padding: 2px 3px 0; }
  .sqrt > .sym { font-size: 1.5em; line-height: 1; align-self: center; }
  .circ { display: inline-block; border: 2px solid var(--accent); border-radius: 50%; padding: 4px 12px; font-weight: 700; }
  .eqhl { color: var(--accent); }
  .modal { position: fixed; inset: 0; background: rgba(20,20,40,.45); display: flex; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
  .modal.hidden { display: none; }
  .modal .box { background: #fff; border-radius: 16px; padding: 20px 22px; max-width: 820px; width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
  .modal h2 { margin: 0 0 4px; font-size: 20px; }
  .modal p { margin: 0 0 12px; color: var(--muted); }
  .lvls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  @media (max-width: 760px) { .lvls { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 460px) { .lvls { grid-template-columns: 1fr; } }
  .lvl { border: 2px solid var(--line); background: #fafaff; border-radius: 12px; padding: 12px; text-align: left; cursor: pointer; font: inherit; color: var(--ink); }
  .lvl:hover { border-color: var(--accent); }
  .lvl b { display: block; font-size: 22px; color: var(--accent); }
  .lvl { display: flex; flex-direction: column; justify-content: flex-start; gap: 4px; }
  .badge:empty { display: none; }
  .lvl b.chili { font-size: 24px; letter-spacing: 2px; line-height: 1.3; min-height: 1.3em; }
  .lvl span { font-size: 13px; color: var(--muted); }
  sub, sup { line-height: 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Spring Energy Challenge</h1>
    <span id="lvlBadge" class="badge" aria-label="Question difficulty"></span>
    <p>Springs, friction and hills: solve for the missing value</p>
    <span class="sp"></span>
    <button id="fsBtn" class="btn" title="Full screen">⛶ Full screen</button>
    <button id="newBtn" class="btn primary">New problem</button>
  </header>
  <div class="layout">
    <div class="main">
      <div class="card stage">
        <canvas id="scene" aria-label="Diagram of the block, spring and surfaces"></canvas>
        <div class="bar">
          <button id="runBtn" class="btn">▶ Run</button>
          <button id="resetBtn" class="btn">↺ Reset</button>
          <label>Speed <select id="speedSel"><option value="1">1×</option><option value="0.5">½×</option><option value="0.25" selected>¼×</option><option value="0.1">0.1×</option></select></label>
          <span id="simMsg" class="simmsg"></span>
          <span id="gChip" class="gchip"></span>
        </div>
      </div>
      <div class="card">
        <h2>Problem</h2>
        <div id="probText"></div>
        <div id="question"></div>
        <div class="answer">
          <label for="ans">Your answer</label>
          <input id="ans" type="text" inputmode="decimal" autocomplete="off" placeholder="e.g. 14 or 1.4e1">
          <select id="unitSel" aria-label="Unit"></select>
          <button id="checkBtn" class="btn primary">Check</button>
        </div>
        <div id="feedback" class="fb"></div>
        <div class="bar stuck">
          <span class="stucklbl">Stuck?</span>
          <button id="hintBtn" class="btn">Give me a hint</button>
          <button id="solBtn" class="btn">Show solution</button>
        </div>
      </div>
      <div id="helpCard" class="card hidden">
        <h2>Help</h2>
        <div id="helpBox"></div>
      </div>
    </div>
  </div>
</div>

<div id="chooser" class="modal">
  <div class="box">
    <h2>Choose question difficulty</h2>
    <p>A new random problem is made each time. Every value can change: surfaces, lengths, angle, spring, mass, start point and even g.</p>
    <div class="lvls">
      <button class="lvl" data-l="1"><b class="chili" aria-label="1 chili">🌶️</b><span>Warm-up. Two kinds of energy, with at most one rough surface.</span></button>
      <button class="lvl" data-l="2"><b class="chili" aria-label="2 chilies">🌶️🌶️</b><span>Like the quiz. Friction on the flat and on the hill, forwards or backwards.</span></button>
      <button class="lvl" data-l="3"><b class="chili" aria-label="3 chilies">🌶️🌶️🌶️</b><span>Challenge. A head start on the hill, a spring caught mid-compression, quadratics.</span></button>
      <button class="lvl" data-l="4"><b class="chili" aria-label="4 chilies">🌶️🌶️🌶️🌶️</b><span>Round trips. The block comes back: find the second compression, the return speed, or how far it gets.</span></button>
    </div>
  </div>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const RETRY = { retry: true };
const fail = () => { throw RETRY; };
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const chance = p => Math.random() < p;
const D2R = Math.PI / 180;
function wpick(list) { // [[item, weight], ...]
  const tot = list.reduce((s, x) => s + x[1], 0); let r = Math.random() * tot;
  for (const [it, w] of list) { if ((r -= w) < 0) return it; }
  return list[list.length - 1][0];
}

/* ---------- numbers, sig digs, units ---------- */
function fmtSF(x, sf) {
  if (x === 0) return '0';
  const xr = Number(x.toPrecision(sf));
  const e = Math.floor(Math.log10(Math.abs(xr)));
  const dec = sf - 1 - e;
  return dec > 0 ? xr.toFixed(dec) : String(Math.round(xr));
}
const SUPD = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹', '-': '⁻' };
function fmtN(x, sf = 4) {
  if (x === 0) return '0';
  const a = Math.abs(x);
  if (a >= 1e5 || a < 1e-3) {
    const e = Math.floor(Math.log10(a)); const m = x / Math.pow(10, e);
    return fmtSF(m, sf) + ' × 10' + String(e).split('').map(c => SUPD[c]).join('');
  }
  return fmtSF(x, sf);
}
const SUPR = { '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9', '⁻': '-', '⁺': '+' };
function parseNum(str) {
  let s = String(str).trim();
  s = s.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻⁺]+/g, m => '^' + [...m].map(c => SUPR[c]).join(''));
  s = s.replace(/\s+/g, '').replace(/−/g, '-');
  if (!s.includes('.') && /^\-?\d*,\d+/.test(s)) s = s.replace(',', '.');
  const re = /^([+-]?)(\d*\.?\d*)(?:[eE]([+-]?\d+)|[x×X*·]10\^?([+-]?\d+))?$/;
  const mt = s.match(re);
  if (!mt || !/\d/.test(mt[2])) return null;
  const mant = mt[2]; const exp = parseInt(mt[3] ?? mt[4] ?? '0', 10);
  let min, max;
  if (mant.includes('.')) {
    const d = mant.replace('.', '').replace(/^0+/, '');
    min = max = Math.max(1, d.length);
  } else {
    const d = mant.replace(/^0+/, '');
    if (!d) { min = max = 1; } else {
      const tz = d.match(/0*$/)[0].length;
      min = Math.max(1, d.length - tz); max = d.length;
    }
  }
  const value = parseFloat((mt[1] || '') + mant) * Math.pow(10, exp);
  if (!isFinite(value)) return null;
  return { value, min, max, mant, exp };
}
const UNITS = [
  { id: '', label: '— choose a unit —' },
  { id: 'none', label: 'no unit', dim: '1', f: 1 },
  { id: 'kg', label: 'kg', dim: 'M', f: 1 }, { id: 'g', label: 'g', dim: 'M', f: 1e-3 },
  { id: 'N/m', label: 'N/m', dim: 'K', f: 1 }, { id: 'kN/m', label: 'kN/m', dim: 'K', f: 1e3 },
  { id: 'm', label: 'm', dim: 'L', f: 1 }, { id: 'cm', label: 'cm', dim: 'L', f: 1e-2 }, { id: 'mm', label: 'mm', dim: 'L', f: 1e-3 },
  { id: 'm/s', label: 'm/s', dim: 'V', f: 1 }, { id: 'km/h', label: 'km/h', dim: 'V', f: 1 / 3.6 },
  { id: 'm/s²', label: 'm/s²', dim: 'A', f: 1 }, { id: 'N/kg', label: 'N/kg', dim: 'A', f: 1 },
  { id: '°', label: '° (degrees)', dim: 'ANG', f: 1 },
  { id: 'J', label: 'J', dim: 'E', f: 1 }, { id: 'N', label: 'N', dim: 'F', f: 1 }, { id: 's', label: 's', dim: 'T', f: 1 }, { id: 'W', label: 'W', dim: 'P', f: 1 },
];
const UNIT = Object.fromEntries(UNITS.map(u => [u.id, u]));
const KIND = {
  len: { dim: 'L', si: 'm' }, k: { dim: 'K', si: 'N/m' }, mass: { dim: 'M', si: 'kg' }, mu: { dim: '1', si: '' },
  ang: { dim: 'ANG', si: '°' }, g: { dim: 'A', si: 'm/s²' }, v: { dim: 'V', si: 'm/s' },
};
function prefUnit(kind, val) {
  if (kind === 'len') return val < 1 && chance(0.55) ? 'cm' : 'm';
  if (kind === 'k') return val >= 1000 ? 'kN/m' : 'N/m';
  if (kind === 'mass') return val < 1 && chance(0.5) ? 'g' : 'kg';
  if (kind === 'mu') return 'none';
  if (kind === 'ang') return '°';
  if (kind === 'g') return 'm/s²';
  return 'm/s';
}
function withUnit(str, unit) { return unit === 'none' ? str : unit === '°' ? str + '°' : str + ' ' + unit; }

/* ---------- materials ---------- */
const MATS = {
  ice: { name: 'ice', adj: 'icy', col: '#a8dcf2', edge: '#5aaed0' },
  grass: { name: 'grass', adj: 'grassy', mu: [0.15, 0.35], col: '#2fae4a', edge: '#1d7a31' },
  wood: { name: 'wood', adj: 'wooden', mu: [0.2, 0.4], col: '#c08a50', edge: '#8a5a2b' },
  carpet: { name: 'carpet', adj: 'carpeted', mu: [0.3, 0.5], col: '#a560c4', edge: '#6f3a87' },
  concrete: { name: 'concrete', adj: 'concrete', mu: [0.35, 0.55], col: '#a3a3a3', edge: '#6c6c6c' },
  sand: { name: 'sand', adj: 'sandy', mu: [0.4, 0.6], col: '#e3c16a', edge: '#b4923e' },
  snow: { name: 'snow', adj: 'snowy', mu: [0.05, 0.15], col: '#f4f8fc', edge: '#90a6bd' },
};
const ROUGH = ['grass', 'wood', 'carpet', 'concrete', 'sand', 'snow'];
function roughExcept(...ex) { return pick(ROUGH.filter(r => !ex.includes(r))); }

/* ---------- scenario building ---------- */
function base(level, type) { return { level, type, vars: {}, flats: [], hill: null, markers: [], stages: [], cands: [], dir: 'fwd', vi: 0 }; }
function addVar(S, key, sym, kind, val, o = {}) {
  S.vars[key] = { key, sym, kind, val, sf: o.sf || 3, unit: o.unit || prefUnit(kind, val), name: o.name || sym, hidden: !!o.hidden, given: true };
  return key;
}
const sfr = () => pick([2, 3, 3]);
function gVar(S) {
  const p = wpick([['Earth', S.level === 1 ? 6 : 5], ['the Moon', 1], ['Mars', 1.3], ['X', 1.5]]);
  let val = p === 'Earth' ? 9.8 : p === 'the Moon' ? 1.62 : p === 'Mars' ? 3.71 : Number(rnd(4, 22).toPrecision(3));
  S.planet = p === 'X' ? 'Planet X' : p;
  addVar(S, 'g', 'g', 'g', val, { sf: 3, name: 'the gravitational field strength (g) on this planet' });
}
function muVar(S, mat) {
  const key = 'mu_' + mat;
  if (!S.vars[key]) addVar(S, key, `μ<sub>${MATS[mat].name}</sub>`, 'mu', rnd(...MATS[mat].mu), { sf: S.level === 1 ? 2 : pick([2, 2, 3]), name: `the coefficient of kinetic friction between the block and the ${MATS[mat].name}` });
  return key;
}
function thetaVar(S, hidden) {
  const sf = S.level >= 2 && chance(0.3) ? 3 : 2;
  const val = sf === 2 ? rint(12, 40) : Math.round(rnd(12, 40) * 10) / 10;
  addVar(S, 'theta', 'θ', 'ang', val, { sf: val >= 10 ? sf : sf - 1, hidden, name: 'the angle of the hill' });
}
function blockVars(S, o = {}) {
  addVar(S, 'm', 'm', 'mass', o.m ?? rnd(0.4, 15), { sf: sfr(), name: 'the mass of the block' });
  addVar(S, 'k', 'k', 'k', o.k ?? rnd(150, 3000), { sf: sfr(), name: 'the spring constant' });
}
// term builders. side is set by position in the equation.
const tEe = (dx = 'dx') => ({ kind: 'e', coef: .5, cs: '½', fs: ['k', [dx, 2]] });
const tEk = (v) => ({ kind: 'k', coef: .5, cs: '½', fs: ['m', [v, 2]] });
const tEg = (d = 'dh') => ({ kind: 'g', coef: 1, cs: '', fs: ['m', 'g', ['h', d]] });
const tWf = (S, mat, dist, hill) => ({ kind: 'f', mat, hill: !!hill, coef: 1, cs: '', fs: [muVar(S, mat), 'm', 'g'].concat(hill ? [['cos', 'theta']] : []).concat([dist, ['c180']]) });
// dist may be a key or ['sum', [k1, k2]]

/* text helpers */
function D(S, key) { const v = S.vars[key]; return v.disp; }
function blockP(S, cap = true) { return (cap ? 'A ' : 'a ') + (S.U === 'm' ? '' : D(S, 'm') + ' ') + 'block'; }
function springP(S) { return S.U === 'k' ? 'a spring' : `a spring (k = ${D(S, 'k')})`; }
function muP(S, mat) { const k = 'mu_' + mat; return S.U === k ? '' : ` (μ = ${D(S, k)})`; }
function planetP(S) {
  if (S.U === 'g') return ' This happens on an unknown planet.';
  if (S.planet === 'Earth') return '';
  return ` This happens on ${S.planet} (g = ${D(S, 'g')}).`;
}
function stopP(S) {
  const h = S.hill; if (!h) return 'before coming to a stop';
  if (S.vars.mus) return `before coming to a stop. The hill's coefficient of static friction is μ<sub>s</sub> = ${D(S, 'mus')}, so the block stays there`;
  const mu = h.mat === 'ice' ? 0 : S.vars['mu_' + h.mat].val;
  return Math.tan(S.vars.theta.val * D2R) > mu ? 'before momentarily coming to rest' : 'before coming to a stop';
}
function genericQ(S) { return `Determine ${S.vars[S.U].name}.`; }

/* ---------- LEVEL 1 ---------- */
function gen1() {
  const t = pick(['A', 'B', 'C', 'D']);
  const S = base(1, '1' + t); gVar(S); blockVars(S);
  if (t === 'A') {
    thetaVar(S);
    addVar(S, 'dx', 'Δx', 'len', rnd(0.05, 0.45), { sf: sfr(), name: 'how far the spring was compressed' });
    addVar(S, 'dh', 'Δd<sub>hill</sub>', 'len', 1, { sf: sfr() });
    S.flats = [{ mat: 'ice' }]; S.hill = { mat: 'ice', showAngle: true };
    S.stages = [{ eq: { L: [tEe()], R: [tEg()] }, out: 'dh' }];
    S.check = () => inR(S, 'dh', 0.2, 6);
    S.cands = [['dh', 3], ['k', 2], ['dx', 2], ['m', 2]];
    S.markers = [{ t: 'hillStop', key: 'dh' }, { t: 'comp', key: 'dx' }];
    S.startDesc = 'block at rest against the compressed spring'; S.endDesc = 'block stopped (for an instant) up the ramp';
    S.text = () => `${blockP(S)} is compressing ${springP(S)}${S.U === 'dx' ? '' : ' by ' + D(S, 'dx')}. It is released and slides along frictionless ice, then up a frictionless icy ramp inclined at ${S.U === 'theta' ? 'an unknown angle' : D(S, 'theta')} above the horizontal.` +
      (S.U !== 'dh' ? ` It slides ${D(S, 'dh')} up the surface of the ramp ${stopP(S)}.` : '') + planetP(S);
    S.q = () => S.U === 'dh' ? 'Determine how far up the ramp (along its surface) the block slides.' : genericQ(S);
  } else if (t === 'B') {
    thetaVar(S, true);
    addVar(S, 'dx', 'Δx', 'len', rnd(0.05, 0.45), { sf: sfr(), name: 'how far the spring was compressed' });
    addVar(S, 'v', 'v', 'v', 1, { sf: sfr(), name: 'the speed of the block after it leaves the spring' });
    S.flats = [{ mat: 'ice' }]; S.hill = { mat: 'ice', showAngle: false };
    S.stages = [{ eq: { L: [tEe()], R: [tEk('v')] }, out: 'v' }];
    S.check = () => inR(S, 'v', 0.5, 15);
    S.cands = [['v', 3], ['k', 2], ['dx', 2], ['m', 2]];
    S.markers = [{ t: 'speed', key: 'v', at: 'ice' }, { t: 'comp', key: 'dx' }];
    S.startDesc = 'block at rest against the compressed spring'; S.endDesc = 'block sliding on the ice after leaving the spring';
    S.text = () => `${blockP(S)} is compressing ${springP(S)}${S.U === 'dx' ? '' : ' by ' + D(S, 'dx')}. It is released and slides along a frictionless icy surface.` +
      (S.U !== 'v' ? ` After it leaves the spring, the block moves at ${D(S, 'v')}.` : '') + planetP(S);

/* ---------- LEVEL 2 ---------- */

/* ---------- LEVEL 3 ---------- */
function gen3() {
  const t = wpick([['A', 3], ['B', 2.5], ['D', 1.2]]);

    addVar(S, 'vi', 'v<sub>i</sub>', 'v', rnd(1, 6), { sf: sfr(), name: 'the speed of the block at its starting point on the hill' });
    const maxC = chance(t === 'A' ? 0.25 : 0.35);
    S.maxC = maxC;
    addVar(S, 'dx', 'Δx', 'len', 1, { sf: sfr(), name: maxC ? 'the maximum compression of the spring' : 'how far the spring is compressed at that moment' });
    if (!maxC) addVar(S, 'vf', 'v<sub>f</sub>', 'v', 1, { sf: sfr(), name: 'the speed of the block at that moment' });
    S.dir = 'rev';
    let L, flatTerms;
    if (t === 'A') {
      const A = roughExcept(D_); S.A = A; muVar(S, A);
      addVar(S, 'L_A', `Δd<sub>${MATS[A].name}</sub>`, 'len', rnd(0.5, 3.5), { sf: sfr(), name: `the length of the horizontal ${MATS[A].name}` });

    } else {
      const A = roughExcept(D_, 'snow'); S.A = A; muVar(S, A);
      addVar(S, 'L_A', `Δd<sub>${MATS[A].name}</sub>`, 'len', rnd(0.4, 2), { sf: sfr(), name: `the length of the ${MATS[A].name} in front of the spring` });
      const midIce = chance(0.5);

      else {

        S.flats = [{ mat: A, lenKey: 'L_A', under: true }, { mat: Bm, lenKey: 'L_B' }]; flatTerms = [tWf(S, Bm, 'L_B')]; S.mid = Bm;

      const Ec = energyAtSpring(S); if (Ec <= 0) fail();

      // max compression xm: .5k x^2 + f x = Ec

    S.markers = [{ t: 'hillStart', key: 'dh', vkey: 'vi' }, { t: 'comp', key: 'dx', ghost: true, vkey: maxC ? null : 'vf' }];

      if (maxC) { if (S.U !== 'dx') s += ` The spring's maximum compression is ${D(S, 'dx')}.`; }

    };
    S.q = () => {

    addVar(S, 'dx', 'Δx', 'len', rnd(0.15, 0.6), { sf: sfr(), name: 'how far the spring was compressed' });

const termSym = (t, sv) => t.cs + t.fs.map(f => fSym(f, sv)).join('');
const termSub = (t, U, sv) => t.cs + t.fs.map(f => fSub(f, U, sv)).join('');
function lab(t, side) {

const frac = (a, b) => `<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const sqrtH = x => `<span class="sqrt"><span class="sym">√</span><span class="rad">${x}</span></span>`;

/* ---------- UI state ---------- */
let S = null;
const state = { sim: null, running: false, revealed: false, hints: 0, speed: 0.25, E0: 1, tries: 0 };
function resetSim() {

$('checkBtn').onclick = check;
$('ans').addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
$('hintBtn').onclick = () => {

let last = performance.now();

$('fsBtn').onclick = () => {
