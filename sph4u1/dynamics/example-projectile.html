<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Projectile Launcher</title>
<style>body{margin:0;font:15px system-ui,sans-serif;background:#fff;color:#222}.c{padding:12px}label{margin-right:16px}canvas{width:100%;height:auto;border:1px solid #ddd;border-radius:8px;display:block;margin-top:10px}</style></head>
<body><div class="c">
<label>Angle <input id="a" type="range" min="5" max="85" value="45"> <span id="av">45</span>°</label>
<label>Speed <input id="v" type="range" min="5" max="30" value="20"> <span id="vv">20</span> m/s</label>
<div id="out"></div><canvas id="cv" width="800" height="360"></canvas></div>
<script>
var a=document.getElementById('a'),v=document.getElementById('v'),cv=document.getElementById('cv'),x=cv.getContext('2d');
function draw(){var th=a.value*Math.PI/180,s=+v.value,g=9.8;document.getElementById('av').textContent=a.value;document.getElementById('vv').textContent=s;
var T=2*s*Math.sin(th)/g,R=s*s*Math.sin(2*th)/g,H=Math.pow(s*Math.sin(th),2)/(2*g),k=760/92;
document.getElementById('out').textContent='Range '+R.toFixed(1)+' m   Max height '+H.toFixed(1)+' m   Flight time '+T.toFixed(2)+' s';
x.clearRect(0,0,800,360);x.strokeStyle='#999';x.beginPath();x.moveTo(20,340);x.lineTo(790,340);x.stroke();
x.strokeStyle='#1a5fb4';x.lineWidth=3;x.beginPath();for(var t=0;t<=T;t+=T/100){var px=20+s*Math.cos(th)*t*k,py=340-(s*Math.sin(th)*t-g*t*t/2)*k;t?x.lineTo(px,py):x.moveTo(px,py)}x.stroke();}
a.oninput=v.oninput=draw;draw();
</script></body></html>
